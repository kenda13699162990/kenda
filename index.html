<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Management</title>
  <style>
    :root {
      --primary: #2f6fed;
      --primary-dark: #1f4eb8;
      --danger: #d9534f;
      --success: #2e8b57;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --border: #dfe7f4;
      --text: #1f2d3d;
      --muted: #62748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 32px auto;
      padding: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(31, 45, 61, 0.06);
      padding: 20px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 1.8rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .file-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="file"],
    input[type="text"],
    input[type="password"] {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      min-height: 42px;
      background: #fff;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      min-height: 42px;
    }

    .primary-btn {
      background: var(--primary);
      color: #fff;
    }

    .primary-btn:hover { background: var(--primary-dark); }

    .danger-btn {
      background: var(--danger);
      color: #fff;
    }

    .success-btn {
      background: var(--success);
      color: #fff;
    }

    .ghost-btn {
      background: #ecf2ff;
      color: var(--primary-dark);
    }

    .status {
      margin-top: 12px;
      min-height: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal.show { display: flex; }

    .modal-box {
      width: min(500px, 100%);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 50px rgba(15, 23, 42, 0.2);
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.3rem;
    }

    .close-btn {
      background: transparent;
      color: var(--text);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      min-height: auto;
      padding: 6px 10px;
    }

    .sheet-list {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f9fbff;
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .admin-form {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: var(--text);
    }

    .field input {
      width: 100%;
    }

    .admin-list-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      max-height: 220px;
      overflow-y: auto;
      background: #fafcff;
      margin-top: 8px;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .admin-item:last-child { margin-bottom: 0; }

    .admin-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
    }

    .admin-name {
      font-weight: 700;
    }

    .admin-password {
      color: var(--muted);
    }

    .small-btn {
      padding: 8px 12px;
      min-height: 36px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .file-input-wrap { flex-direction: column; align-items: stretch; }
      .modal-actions { justify-content: stretch; }
      .modal-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h2>Excel Management</h2>

      <div class="toolbar">
        <div class="file-input-wrap">
          <label for="excelFile">เลือกไฟล์ Excel:</label>
          <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" />
        </div>

        <button id="btnExport" class="primary-btn">Export File</button>
        <button id="btnAddAdmins" class="success-btn">Add Admins</button>
        <button id="btnClear" class="danger-btn">Clear File</button>
      </div>

      <div id="status" class="status">ยังไม่มีไฟล์ Excel ที่ถูกโหลด</div>
    </div>
  </div>

  <div id="exportModal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Export File</h3>
        <button class="close-btn" data-close="exportModal">×</button>
      </div>
      <p>เลือกชีตที่ต้องการ Export:</p>
      <div id="exportSheetList" class="sheet-list"></div>
      <div class="modal-actions">
        <button id="confirmExport" class="primary-btn">Export</button>
        <button class="ghost-btn" data-close="exportModal">ยกเลิก</button>
      </div>
    </div>
  </div>

  <div id="adminModal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Add Admins</h3>
        <button class="close-btn" data-close="adminModal">×</button>
      </div>

      <div class="admin-form">
        <div class="field">
          <label for="adminUsername">Username</label>
          <input id="adminUsername" type="text" placeholder="กรอก Username" />
        </div>

        <div class="field">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" placeholder="กรอก Password" />
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="btnAddAdminRow" class="success-btn small-btn">เพิ่ม</button>
          <button id="btnDeleteAdminRow" class="danger-btn small-btn">ลบ</button>
        </div>
      </div>

      <div>
        <h4 style="margin: 18px 0 10px;">รายชื่อ Admin</h4>
        <div id="adminList" class="admin-list-box"></div>
      </div>

      <div class="modal-actions">
        <button class="ghost-btn" data-close="adminModal">ปิด</button>
      </div>
    </div>
  </div>

  <div id="clearModal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Clear File</h3>
        <button class="close-btn" data-close="clearModal">×</button>
      </div>
      <p>เลือกชีตที่ต้องการเคลียร์ข้อมูล แต่ไม่ลบหัวชีต</p>
      <div id="clearSheetList" class="sheet-list"></div>
      <div class="modal-actions">
        <button id="confirmClear" class="danger-btn">Clear</button>
        <button class="ghost-btn" data-close="clearModal">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const SHEET_NAMES = ["IMEI_Status", "Customer", "All_Record", "Employee", "Admin"];
    const app = {
      workbook: null,
      selectedFileName: "workbook.xlsx",
      adminSelectedIndex: null
    };

    const statusEl = document.getElementById("status");
    const exportModal = document.getElementById("exportModal");
    const adminModal = document.getElementById("adminModal");
    const clearModal = document.getElementById("clearModal");
    const excelFileInput = document.getElementById("excelFile");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? ` ${type}` : "");
    }

    function createDefaultWorkbook() {
      const wb = XLSX.utils.book_new();
      SHEET_NAMES.forEach(name => {
        const ws = XLSX.utils.aoa_to_sheet([["" ]]);
        ws["!cols"] = [{ wch: 20 }];
        XLSX.utils.book_append_sheet(wb, ws, name);
      });
      return wb;
    }

    function ensureWorkbookHasSheets() {
      if (!app.workbook) {
        app.workbook = createDefaultWorkbook();
      }

      SHEET_NAMES.forEach(sheetName => {
        if (!app.workbook.Sheets[sheetName]) {
          const ws = XLSX.utils.aoa_to_sheet([[]]);
          XLSX.utils.book_append_sheet(app.workbook, ws, sheetName);
        }
      });
    }

    function populateSheetCheckboxes(targetId, selectedValues = []) {
      const container = document.getElementById(targetId);
      container.innerHTML = "";

      SHEET_NAMES.forEach(sheetName => {
        const row = document.createElement("label");
        row.className = "check-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = sheetName;
        checkbox.checked = selectedValues.includes(sheetName);

        const text = document.createElement("span");
        text.textContent = sheetName;

        row.appendChild(checkbox);
        row.appendChild(text);
        container.appendChild(row);
      });
    }

    function openModal(modalEl) {
      modalEl.classList.add("show");
    }

    function closeModal(modalEl) {
      modalEl.classList.remove("show");
    }

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        const modal = document.getElementById(btn.dataset.close);
        closeModal(modal);
      });
    });

    function readAdminRows() {
      ensureWorkbookHasSheets();
      const adminSheet = app.workbook.Sheets["Admin"];
      if (!adminSheet) return [];

      const rows = XLSX.utils.sheet_to_json(adminSheet, { header: 1, blankrows: false, defval: "" });
      const adminRows = [];

      rows.forEach((row, index) => {
        if (index === 0) return; // skip header if any
        if (!row || row.length === 0) return;
        const username = row[0] ?? "";
        const password = row[1] ?? "";
        if (username && password) {
          adminRows.push({ username, password, rowIndex: index });
        }
      });

      return adminRows;
    }

    function renderAdminList() {
      const adminList = document.getElementById("adminList");
      adminList.innerHTML = "";
      const admins = readAdminRows();

      if (admins.length === 0) {
        adminList.innerHTML = "<div style='color:#62748b;'>ยังไม่มีข้อมูล Admin</div>";
        return;
      }

      admins.forEach((admin, index) => {
        const row = document.createElement("div");
        row.className = "admin-item";
        row.dataset.index = String(index);

        const info = document.createElement("div");
        info.className = "admin-meta";
        info.innerHTML = `
          <span class="admin-name">${admin.username}</span>
          <span class="admin-password">${admin.password}</span>
        `;

        const selectBtn = document.createElement("button");
        selectBtn.className = "ghost-btn small-btn";
        selectBtn.textContent = "เลือก";
        selectBtn.addEventListener("click", () => {
          app.adminSelectedIndex = index;
          adminList.querySelectorAll(".admin-item").forEach(item => item.style.borderColor = "#dfe7f4");
          row.style.borderColor = "#2f6fed";
        });

        row.appendChild(info);
        row.appendChild(selectBtn);
        adminList.appendChild(row);
      });
    }

    function saveWorkbookToFile(fileName = app.selectedFileName) {
      ensureWorkbookHasSheets();
      XLSX.writeFile(app.workbook, fileName);
    }

    function loadExcelFile(file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        try {
          app.workbook = XLSX.read(data, { type: "array" });
          app.selectedFileName = file.name || "workbook.xlsx";
          ensureWorkbookHasSheets();
          setStatus(`โหลดไฟล์สำเร็จ: ${file.name}`, "success");
          renderAdminList();
        } catch (error) {
          setStatus("ไฟล์ Excel ไม่ถูกต้องหรือเสียหาย", "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    excelFileInput.addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;
      loadExcelFile(file);
    });

    document.getElementById("btnExport").addEventListener("click", function () {
      ensureWorkbookHasSheets();
      populateSheetCheckboxes("exportSheetList", SHEET_NAMES);
      openModal(exportModal);
    });

    document.getElementById("confirmExport").addEventListener("click", function () {
      const checked = [...document.querySelectorAll("#exportSheetList input:checked")].map(el => el.value);

      if (!checked.length) {
        setStatus("กรุณาเลือกชีตอย่างน้อย 1 ชีต", "error");
        return;
      }

      const exportWorkbook = XLSX.utils.book_new();
      checked.forEach(sheetName => {
        const sheet = app.workbook.Sheets[sheetName];
        if (sheet) {
          XLSX.utils.book_append_sheet(exportWorkbook, sheet, sheetName);
        }
      });

      const fileName = `export_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.xlsx`;
      XLSX.writeFile(exportWorkbook, fileName);
      setStatus(`Export สำเร็จ: ${fileName}`, "success");
      closeModal(exportModal);
    });

    document.getElementById("btnAddAdmins").addEventListener("click", function () {
      ensureWorkbookHasSheets();
      renderAdminList();
      document.getElementById("adminUsername").value = "";
      document.getElementById("adminPassword").value = "";
      app.adminSelectedIndex = null;
      openModal(adminModal);
    });

    document.getElementById("btnAddAdminRow").addEventListener("click", function () {
      const username = document.getElementById("adminUsername").value.trim();
      const password = document.getElementById("adminPassword").value.trim();

      if (!username || !password) {
        setStatus("กรุณากรอก Username และ Password", "error");
        return;
      }

      ensureWorkbookHasSheets();
      const adminSheet = app.workbook.Sheets["Admin"];
      let rows = XLSX.utils.sheet_to_json(adminSheet, { header: 1, blankrows: false, defval: "" });

      if (!rows.length) {
        rows = [["Username", "Password"]];
      }

      if (rows[0][0] !== "Username" || rows[0][1] !== "Password") {
        rows = [["Username", "Password"], ...rows];
      }

      // check duplicate
      const exists = rows.some((row, index) => {
        if (index === 0) return false;
        return String(row[0]).trim() === username;
      });

      if (exists) {
        setStatus("Username นี้มีอยู่แล้วใน Admin", "error");
        return;
      }

      rows.push([username, password]);
      app.workbook.Sheets["Admin"] = XLSX.utils.aoa_to_sheet(rows);
      app.workbook.Sheets["Admin"]["!cols"] = [{ wch: 20 }, { wch: 20 }];

      renderAdminList();
      setStatus(`เพิ่ม Admin สำเร็จ: ${username}`, "success");
      document.getElementById("adminUsername").value = "";
      document.getElementById("adminPassword").value = "";

      if (app.selectedFileName) {
        try {
          XLSX.writeFile(app.workbook, app.selectedFileName);
        } catch (error) {
          setStatus("บันทึกข้อมูล Admin สำเร็จ แต่ไม่สามารถบันทึกไฟล์ได้ทันที", "success");
        }
      }
    });

    document.getElementById("btnDeleteAdminRow").addEventListener("click", function () {
      const admins = readAdminRows();
      if (!admins.length || app.adminSelectedIndex === null || app.adminSelectedIndex >= admins.length) {
        setStatus("กรุณาเลือก Admin ที่ต้องการลบ", "error");
        return;
      }

      const admin = admins[app.adminSelectedIndex];
      const sheet = app.workbook.Sheets["Admin"];
      let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: "" });

      if (!rows.length) return;

      if (rows[0][0] === "Username" && rows[0][1] === "Password") {
        rows = rows.filter((row, index) => {
          if (index === 0) return true;
          return !(String(row[0]).trim() === String(admin.username).trim() && String(row[1]).trim() === String(admin.password).trim());
        });
      } else {
        rows = rows.filter((row, index) => {
          if (index === 0) return true;
          return !(String(row[0]).trim() === String(admin.username).trim() && String(row[1]).trim() === String(admin.password).trim());
        });
      }

      if (!rows.length) {
        rows = [["Username", "Password"]];
      }

      app.workbook.Sheets["Admin"] = XLSX.utils.aoa_to_sheet(rows);
      app.workbook.Sheets["Admin"]["!cols"] = [{ wch: 20 }, { wch: 20 }];
      app.adminSelectedIndex = null;
      renderAdminList();
      setStatus(`ลบ Admin สำเร็จ: ${admin.username}`, "success");
      if (app.selectedFileName) {
        try {
          XLSX.writeFile(app.workbook, app.selectedFileName);
        } catch (error) {
          setStatus("ลบข้อมูลแล้ว แต่ไม่สามารถบันทึกไฟล์ได้ทันที", "success");
        }
      }
    });

    document.getElementById("btnClear").addEventListener("click", function () {
      ensureWorkbookHasSheets();
      populateSheetCheckboxes("clearSheetList", SHEET_NAMES);
      openModal(clearModal);
    });

    document.getElementById("confirmClear").addEventListener("click", function () {
      const checked = [...document.querySelectorAll("#clearSheetList input:checked")].map(el => el.value);

      if (!checked.length) {
        setStatus("กรุณาเลือกชีตที่ต้องการเคลียร์อย่างน้อย 1 ชีต", "error");
        return;
      }

      checked.forEach(sheetName => {
        if (!app.workbook.Sheets[sheetName]) {
          const ws = XLSX.utils.aoa_to_sheet([[]]);
          app.workbook.Sheets[sheetName] = ws;
          return;
        }

        const original = XLSX.utils.sheet_to_json(app.workbook.Sheets[sheetName], { header: 1, blankrows: false, defval: "" });
        if (!original.length) {
          app.workbook.Sheets[sheetName] = XLSX.utils.aoa_to_sheet([[]]);
          return;
        }

        const header = original[0] || [];
        const cleaned = [header];
        app.workbook.Sheets[sheetName] = XLSX.utils.aoa_to_sheet(cleaned);
        app.workbook.Sheets[sheetName]["!cols"] = Array.from({ length: Math.max(header.length, 1) }, () => ({ wch: 20 }));
      });

      setStatus(`เคลียร์ข้อมูลสำเร็จในชีต: ${checked.join(", ")}`, "success");
      renderAdminList();
      if (app.selectedFileName) {
        try {
          XLSX.writeFile(app.workbook, app.selectedFileName);
        } catch (error) {
          setStatus("เคลียร์ข้อมูลสำเร็จ แต่ไม่สามารถบันทึกไฟล์ได้ทันที", "success");
        }
      }
      closeModal(clearModal);
    });

    document.addEventListener("DOMContentLoaded", function () {
      app.workbook = createDefaultWorkbook();
      app.selectedFileName = "workbook.xlsx";
      populateSheetCheckboxes("exportSheetList", SHEET_NAMES);
      populateSheetCheckboxes("clearSheetList", SHEET_NAMES);
      renderAdminList();
    });
  </script>
</body>
</html>
